<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(145deg,#f8f8f8,#ececec);color:#171717}
.wrap{max-width:520px;margin:auto;padding:18px 14px 32px}
.card{background:#fff;border-radius:28px;padding:18px 14px 25px;box-shadow:0 10px 35px #0002}
.logo{width:min(360px,100%);height:auto;display:block;margin:0 auto 12px;border-radius:20px}
h1{font-size:22px;text-align:center;margin:8px 0 5px}
.sub{text-align:center;color:#777;font-size:14px;margin-bottom:20px}
.buttons{display:grid;gap:12px}
.btn{width:100%;border:0;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:white;border-radius:17px;padding:16px 12px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 5px 13px #0002}
.fb{background:#1877f2} .wa{background:#18a957} .map{background:#d53a2f} .cash{background:#8d2222}
.ico{font-size:24px;width:30px;text-align:center}
.note{text-align:center;color:#777;font-size:12px;margin-top:17px}
#cashBox{display:none;position:fixed;inset:0;background:#000b;z-index:20;padding:15px;overflow:auto}
.modal{max-width:480px;margin:10px auto;background:white;border-radius:24px;padding:15px}
.modal h2{text-align:center;margin:3px 0 13px}
.cashqr{display:block;width:100%;height:auto;border-radius:14px}
.close{width:100%;border:0;background:#222;color:white;border-radius:14px;padding:14px;margin-top:12px;font-size:16px;font-weight:bold}
</style>
